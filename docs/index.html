<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning CHI — maquettes</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04060B;color:#E6FCFF;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid #16232E;background:#080C13;flex:0 0 auto}
  .brand{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-right:8px;font-family:ui-monospace,Menlo,monospace}
  .brand span{color:#00E5FF}
  button{
    background:transparent;color:#5E7C8C;border:1px solid #16232E;border-radius:4px;
    padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;
    font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;text-transform:uppercase
  }
  button:hover{color:#E6FCFF;border-color:#00E5FF}
  button.on{background:rgba(0,229,255,.12);color:#00E5FF;border-color:#00E5FF}
  .spacer{flex:1}
  a{color:#B6FF3B;font-size:11px;text-decoration:none;font-weight:700;font-family:ui-monospace,Menlo,monospace;letter-spacing:.8px;text-transform:uppercase}
  a:hover{text-decoration:underline}
  iframe{flex:1;width:100%;border:0;background:#04060B}
</style>
</head>
<body>
  <header>
    <div class="brand">Planning <span>CHI</span></div>
    <button id="b1" class="on" onclick="show(1)">Nocturne néon</button>
    <button id="b2" onclick="show(2)">5 directions</button>
    <button id="b3" onclick="show(3)">Aurora (ancien)</button>
    <div class="spacer"></div>
    <a id="open" href="design-neon.html" target="_blank">plein écran ↗</a>
  </header>
  <iframe id="f" src="design-neon.html" title="maquettes"></iframe>
  <script>
    const pages = {1:'design-neon.html', 2:'design-directions.html', 3:'design-preview.html'};
    function show(n){
      document.getElementById('f').src = pages[n];
      document.getElementById('open').href = pages[n];
      for (const k of [1,2,3]) {
        document.getElementById('b'+k).classList.toggle('on', k === n);
      }
    }
  </script>
</body>
</html>
