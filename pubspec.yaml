name: night_shift_planning
description: "Application de planification des gardes de nuit pour équipe médicale - Android 100% hors-ligne"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database - Hive (rapide, sans serveur, hors-ligne)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF Processing
  syncfusion_flutter_pdf: ^28.1.38

  # OCR - Google ML Kit (local, hors-ligne)
  google_mlkit_text_recognition: ^0.17.1

  # Notifications & Alarms
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Calendar
  table_calendar: ^3.2.0

  # Charts & Statistics
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.20.0
  path_provider: ^2.1.5
  file_picker: ^13.3.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation (adapters Hive)
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/branding/